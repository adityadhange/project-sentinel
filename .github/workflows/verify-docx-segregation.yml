name: Verify DOCX repository disposition

on:
  push:
    paths:
      - "**/*.docx"
      - "99_Legacy_DOCX_Binaries/**"
      - ".gitattributes"
      - ".github/workflows/verify-docx-segregation.yml"
      - ".github/workflows/convert-docx-to-md.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify documented DOCX absence and export disposition
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d 99_Legacy_DOCX_Binaries ]]; then
            echo "ERROR: 99_Legacy_DOCX_Binaries exists, but no authorized DOCX source-of-record is currently established. Do not restore, relocate, or delete files through this workflow."
            exit 1
          fi

          mapfile -d '' tracked_docx < <(git ls-files -z -- '*.docx')
          if (( ${#tracked_docx[@]} != 0 )); then
            echo "ERROR: DOCX files are tracked without an approved source-of-record disposition:"
            printf '  %s\n' "${tracked_docx[@]}"
            exit 1
          fi

          grep -qxF '99_Legacy_DOCX_Binaries/** export-ignore' .gitattributes
          grep -qxF '*.docx export-ignore' .gitattributes

          archive=$(mktemp --suffix=.tar)
          trap 'rm -f "$archive"' EXIT
          git archive --format=tar HEAD > "$archive"
          if tar -tf "$archive" | grep -E '(^|/)99_Legacy_DOCX_Binaries(/|$)|\.docx$'; then
            echo "ERROR: DOCX files or the retired archive root appear in the Git export."
            exit 1
          fi

          echo "PASS: no DOCX files are tracked, the retired archive root is absent, and the protective export-ignore rules remain present."
