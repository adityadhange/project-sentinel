name: Convert DOCX to Markdown

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert DOCX files to GFM Markdown
        run: |
          find . -type f -name "*.docx" | while IFS= read -r file; do
            # Strip .docx, and also strip trailing .md if named *.md.docx
            base="${file%.docx}"
            base="${base%.md}"
            target="${base}.md"

            echo "Converting: $file -> $target"
            pandoc "$file" -f docx -t gfm --wrap=none -o "$target"
            git rm -f "$file"
          done

      - name: Commit converted Markdown files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: convert legacy .docx files to Markdown and remove binary bloat"
            git push
          else
            echo "No .docx files found to convert."
          fi
