name: Task Pack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-tests:
    name: Reference implementation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run canonical structure and Markdown link audit
        run: npm run audit:structure

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run repository task-pack pytest suites
        run: python -m pytest Task_Packs/SNT-010 Task_Packs/SNT-011 -q
