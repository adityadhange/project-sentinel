name: Task Pack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-tests:
    name: Reference implementation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SNT-010 tests
        run: python -m unittest discover -s Task_Packs/SNT-010 -p 'test_*.py' -v

      - name: Run SNT-011 tests
        run: python -m unittest discover -s Task_Packs/SNT-011 -p 'test_*.py' -v
