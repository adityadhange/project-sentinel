name: Deduplicate Exact Bit-for-Bit Copies

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (generate candidate manifest; do not delete or publish)'
        type: boolean
        default: true
      proposal_id:
        description: 'Approval proposal issue number (required for active PR creation)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.11'

      - name: Inventory exact duplicates and build deterministic manifest
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, os
          from pathlib import Path
          from collections import defaultdict

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""): h.update(chunk)
              return h.hexdigest()

          def score(path):
              p = path.lower()
              n = 0
              for needle, points in [("_recovered_duplicate_copies",100),("_historical_source_material",40),("copy of",50),(".md.md",40),("[superseded",15)]:
                  if needle in p: n += points
              if re.search(r"\(\d+\)", p): n += 30
              return n + len(path) * 0.05

          archive = Path("02_Archive_Legacy")
          if archive.is_symlink(): raise SystemExit("::error::Archive root is a symlink.")
          resolved = archive.resolve()
          listing = subprocess.run(["git","ls-tree","-r","-z","--full-tree","HEAD"],check=True,stdout=subprocess.PIPE).stdout
          archived, active = defaultdict(list), defaultdict(list)
          for entry in listing.split(b"\0"):
              if not entry: continue
              meta, raw = entry.split(b"\t",1)
              mode, typ, oid = meta.decode("ascii").split(" ",2)
              if typ != "blob" or mode not in ("100644","100755"): continue
              path = raw.decode("utf-8","surrogateescape")
              if Path(path).name == ".gitkeep": continue
              (archived if path.startswith("02_Archive_Legacy/") else active)[oid].append(path)
          cross = set(archived) & set(active)
          if cross:
              for oid in sorted(cross): print(f"Cross-boundary blob {oid}: archive={archived[oid]} active={active[oid]}")
              raise SystemExit("::error::Cross-boundary duplicate group; no deletion.")

          files = []
          if archive.is_dir():
              for p in archive.rglob("*"):
                  if p.name == ".gitkeep" or p.is_symlink() or not p.is_file(): continue
                  if resolved not in p.resolve().parents: raise SystemExit(f"::error::Path escaped archive: {p}")
                  files.append(p)
          groups = defaultdict(list)
          for p in files: groups[sha256(p)].append(p.as_posix())
          candidates = []
          for digest, paths in groups.items():
              if len(paths) < 2: continue
              ordered = sorted(paths,key=score)
              candidates.extend((p,digest,ordered[0]) for p in ordered[1:])
          candidates.sort(key=lambda x:x[0])

          manifest = Path("DELETION_MANIFEST.txt")
          with manifest.open("w",encoding="utf-8",newline="\n") as out:
              out.write("# Project Sentinel exact-duplicate deletion manifest v1\n")
              out.write("# JSONL records: candidate path, SHA-256, retained canonical path\n")
              for path,digest,keeper in candidates:
                  out.write(json.dumps({"path":path,"sha256":digest,"keep":keeper},ensure_ascii=True,sort_keys=True,separators=(",",":"))+"\n")
          manifest_hash = sha256(manifest)
          print(f"Manifest SHA-256: {manifest_hash}")
          print(f"Deletion candidates: {len(candidates)}")
          print(f"Required approval comment line: APPROVE SNT-TO-13 {manifest_hash}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"candidate_count={len(candidates)}\nmanifest_sha256={manifest_hash}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("# Exact duplicate inventory\n\n")
              out.write(f"- Candidates: {len(candidates)}\n- Manifest SHA-256: {manifest_hash}\n")
              out.write("- Dry-run inventory only; no files removed and no PR created.\n")
              out.write("\n## Exact deletion manifest\n\n```text\n")
              out.write(manifest.read_text(encoding="utf-8"))
              out.write("```\n")
          PY

      - name: Verify Principal Operator approval bound to manifest
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.inventory.outputs.manifest_sha256 }}
          PRINCIPAL_OPERATOR: adityadhange
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PROPOSAL_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::proposal_id must be a numeric GitHub issue number."; exit 1
          fi
          if [[ ! "$EXPECTED_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Manifest digest is missing or malformed."; exit 1
          fi
          ISSUE="$(gh issue view "$PROPOSAL_ID" --repo "$GH_REPO" --json number,state,comments)"
          [[ "$(jq -r '.number' <<<"$ISSUE")" == "$PROPOSAL_ID" ]] || { echo "::error::Proposal issue number mismatch."; exit 1; }
          [[ "$(jq -r '.state' <<<"$ISSUE")" == "OPEN" ]] || { echo "::error::Proposal issue must be open."; exit 1; }
          REQUIRED="APPROVE SNT-TO-13 $EXPECTED_MANIFEST_SHA256"
          APPROVED="$(jq -r --arg principal "$PRINCIPAL_OPERATOR" --arg marker "$REQUIRED" '
            [.comments[] | select(.author.login == $principal)
             | select((.body | split("\n") | map(sub("\r$"; "")) | index($marker)) != null)
            ] | length > 0
          ' <<<"$ISSUE")"
          [[ "$APPROVED" == "true" ]] || {
            echo "::error::No exact Principal Operator approval for this manifest digest on issue #$PROPOSAL_ID."
            echo "::error::Required standalone comment line: $REQUIRED"; exit 1;
          }
          echo "Approval and manifest digest verified."

      - name: Revalidate manifest and remove approved archive candidates in runner workspace
        id: cleanup
        if: ${{ inputs.dry_run == false }}
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.inventory.outputs.manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum DELETION_MANIFEST.txt | awk '{print $1}')"
          [[ "$ACTUAL" == "$EXPECTED_MANIFEST_SHA256" ]] || { echo "::error::Manifest changed after approval."; exit 1; }
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          archive=Path("02_Archive_Legacy")
          if archive.is_symlink(): raise SystemExit("::error::Archive root became a symlink.")
          root=archive.resolve()
          records=[]
          with open("DELETION_MANIFEST.txt",encoding="utf-8") as f:
              for line in f:
                  if line.startswith("#") or not line.strip(): continue
                  records.append(json.loads(line))
          def digest(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for chunk in iter(lambda:f.read(65536),b""): h.update(chunk)
              return h.hexdigest()
          for rec in records:
              p=Path(rec["path"])
              if not p.as_posix().startswith("02_Archive_Legacy/"): raise SystemExit(f"::error::Out-of-bound path: {p}")
              if p.name==".gitkeep" or p.is_symlink() or not p.is_file(): raise SystemExit(f"::error::Protected/missing/non-regular candidate: {p}")
              if root not in p.resolve().parents: raise SystemExit(f"::error::Resolved path escaped archive: {p}")
              if digest(p)!=rec["sha256"]: raise SystemExit(f"::error::SHA-256 mismatch: {p}")
          for rec in records: Path(rec["path"]).unlink()
          with open(os.environ["GITHUB_OUTPUT"],"a") as out: out.write(f"deleted_count={len(records)}\n")
          PY

      - name: Create Draft Pull Request with immutable manifest
        if: ${{ inputs.dry_run == false && steps.cleanup.outputs.deleted_count > 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          DELETED_COUNT: ${{ steps.cleanup.outputs.deleted_count }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.inventory.outputs.manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum DELETION_MANIFEST.txt | awk '{print $1}')"
          [[ "$ACTUAL" == "$EXPECTED_MANIFEST_SHA256" ]] || { echo "::error::Manifest digest changed before PR creation."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="cleanup/exact-duplicates-$(date -u +%Y%m%dT%H%M%SZ)"
          git checkout -b "$BRANCH"
          git add -u -- 02_Archive_Legacy/
          git add -- DELETION_MANIFEST.txt
          git commit -m "chore: propose ${DELETED_COUNT} exact duplicate removals"
          git push origin "$BRANCH"
          {
            printf '%s\n' "Automated exact-duplicate cleanup proposal."
            printf '\n- Approval proposal: #%s\n' "$PROPOSAL_ID"
            printf '\n- Principal Operator: @adityadhange\n'
            printf '\n- Candidate count: %s\n' "$DELETED_COUNT"
            printf '\n- Manifest SHA-256: %s\n' "$ACTUAL"
            printf '\n### Safeguards\n'
            printf '%s\n' "- Deletion candidates restricted to 02_Archive_Legacy/."
            printf '%s\n' "- Symlinks and .gitkeep files are excluded."
            printf '%s\n' "- Candidate SHA-256 values revalidated before removal."
            printf '%s\n' "- This workflow creates a draft PR; it never merges."
            printf '\n### DELETION_MANIFEST.txt\n\n'
            cat DELETION_MANIFEST.txt
          } > PR_BODY.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --draft \
            --title "[SNT-TO-13] Propose ${DELETED_COUNT} verified archive duplicate removals" \
            --body-file PR_BODY.md
