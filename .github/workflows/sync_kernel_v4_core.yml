name: Kernel Core Promotion Preflight (Read-Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion_preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inspect proposed legacy source mappings
        run: |
          python - << 'PY'
          import os
          import re
          import sys
          from pathlib import Path

          # These are the source mappings used by the former automated sync.
          # This preflight never copies files or writes to the repository.
          mappings = [
              ('02_Archive_Legacy/v3.6_transition_source/01-sentinel-manager-v3.6.0.md',
               '00_Control_Plane_v4.0/sentinel-manager.md'),
              ('02_Archive_Legacy/v3.6_transition_source/07-verifier-records-officer-v3.6.0.md',
               '00_Control_Plane_v4.0/verifier-officer.md'),
              ('02_Archive_Legacy/v3.6_transition_source/from_mislabeled_v4.0/RUL-Shared_Governance_Contract (Kernel v4.0).md(1).md',
               '00_Control_Plane_v4.0/RUL-Shared_Governance_Contract.md'),
              ('02_Archive_Legacy/v3.6_transition_source/from_mislabeled_v4.0/RUL-Capability_Permissions_Matrix (Kernel v4.0).md(1).md',
               '00_Control_Plane_v4.0/RUL-Capability_Permissions_Matrix.md'),
              ('02_Archive_Legacy/v3.6_transition_source/06-assembly-operator-v3.6.0.md',
               '00_Control_Plane_v4.0/operator.md'),
              ('02_Archive_Legacy/v3.6_transition_source/04-researcher-v3.6.0.md',
               '00_Control_Plane_v4.0/researcher.md'),
              ('02_Archive_Legacy/v3.3_to_v3.5/Kernel_v3.5/05_critical-analyst (Kernel v3.5.0 Ratified).md',
               '00_Control_Plane_v4.0/critical-analyst.md'),
              ('02_Archive_Legacy/v3.6_transition_source/08_co-developer (Kernel v3.6.0 Ratified).md(1).md',
               '00_Control_Plane_v4.0/co-developer.md'),
          ]

          results = []
          for source, target in mappings:
              path = Path(source)
              if not path.is_file():
                  results.append((source, target, 'MISSING SOURCE'))
                  continue
              source_text = path.read_text(encoding='utf-8', errors='replace')
              version_match = re.search(r'Kernel v(\d+\.\d+)', source_text[:12000], re.IGNORECASE)
              version = version_match.group(1) if version_match else 'UNIDENTIFIED'
              status = 'REVIEW REQUIRED' if version == '4.0' else 'BLOCKED: NOT VERIFIED AS KERNEL 4.0'
              results.append((source, target, f'{status} (detected version: {version})'))

          lines = [
              '# Kernel Core Promotion Preflight',
              '',
              '- **Mode:** READ-ONLY; no copy, rename, commit, branch creation, or pull request.',
              '- **Promotion rule:** Historical material is not promoted merely because it is complete or has a clean filename.',
              '- **Required:** Each active specification must be reconciled against the approved current architecture, authority model, and operator dispositions in a separately reviewed change.',
              '',
              '## Source mapping review',
              '',
          ]
          for source, target, status in results:
              lines.extend([f'### {target}', f'- Source: {source}', f'- Result: {status}', ''])

          blocked = [item for item in results if 'BLOCKED' in item[2] or 'MISSING' in item[2]]
          lines.extend([
              '---',
              f'**Mappings reviewed:** {len(results)}',
              f'**Mappings blocked or unverified as Kernel 4.0:** {len(blocked)}',
              '',
              '**No repository files were changed.** Any promotion requires a separate, human-reviewed pull request.',
              '',
          ])
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines), encoding='utf-8')
          for source, target, status in results:
              print(f'{status}: {source} -> {target}')
          print('READ-ONLY PREFLIGHT COMPLETE. No repository mutations performed.')
          if blocked:
              print(f'Promotion must remain blocked: {len(blocked)} mapping(s) are not verified as Kernel 4.0.')
              sys.exit(1)
          PY
