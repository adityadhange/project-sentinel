name: Sentinel Document Audit & Divergence Scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Run Sentinel Deep Audit
        run: |
          python - << 'PY'
          import os
          import re
          import hashlib
          import difflib
          from pathlib import Path
          from collections import defaultdict

          def get_sha256(filepath):
              hasher = hashlib.sha256()
              try:
                  with open(filepath, 'rb') as f:
                      for chunk in iter(lambda: f.read(65536), b''):
                          hasher.update(chunk)
                  return hasher.hexdigest()
              except Exception:
                  return None

          def get_file_stats(filepath):
              # Office Open XML files are ZIP containers, not text previews.
              if filepath.suffix.lower() in {'.docx', '.xlsx'}:
                  return 0, 0, ""
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      text = f.read()
                  lines = text.splitlines()
                  return len(text), len(lines), text[:1500]
              except Exception:
                  return 0, 0, ""

          def clean_stem(name):
              # Strip chained Markdown extensions/duplicate markers, e.g. .md(1).md.
              n = re.sub(r'(?:\.md|\(\d+\))+$', '', name, flags=re.IGNORECASE)
              return re.sub(r'[\s_\-\(\)]+', '', n).lower()

          root = Path('.')
          ignored_dirs = {'.git', '.github'}
          all_files = [
              f for f in root.rglob('*')
              if f.is_file() and not any(part in ignored_dirs for part in f.parts)
          ]

          hash_map = defaultdict(list)
          family_map = defaultdict(list)
          extension_glitches = []
          active_naming_violations = []

          for directory in root.rglob('*'):
              if not directory.is_dir() or '.git' in directory.parts:
                  continue
              if '02_Archive_Legacy' in directory.parts:
                  continue
              if directory.name != '.github' and not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', directory.name):
                  active_naming_violations.append(f"directory: {directory}")

          for f in all_files:
              rel_path = str(f)
              h = get_sha256(f)
              size_kb = round(f.stat().st_size / 1024, 2)
              chars, lines, preview = get_file_stats(f)
              file_info = {
                  'path': rel_path,
                  'name': f.name,
                  'size_kb': size_kb,
                  'lines': lines,
                  'chars': chars,
                  'hash': h,
                  'preview': preview
              }
              if h:
                  hash_map[h].append(file_info)
              family_map[clean_stem(f.name)].append(file_info)

              if re.search(r'(?:\.md|\(\d+\)){2,}$', f.name, re.IGNORECASE):
                  extension_glitches.append(rel_path)
                  if '02_Archive_Legacy' not in f.parts:
                      active_naming_violations.append(f"file: {rel_path}")

          exact_duplicates = [group for group in hash_map.values() if len(group) > 1]
          divergent_families = []
          for group in family_map.values():
              if len(group) > 1:
                  unique_hashes = {item['hash'] for item in group if item['hash']}
                  if len(unique_hashes) > 1:
                      divergent_families.append(group)

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', 'summary.md')
          with open(summary_path, 'w', encoding='utf-8') as out:
              out.write("# Project Sentinel — Precision Audit Report\n\n")
              out.write(f"- **Total Files Scanned:** {len(all_files)}\n")
              out.write(f"- **Exact Duplicate Groups:** {len(exact_duplicates)}\n")
              out.write(f"- **Divergent Version Families:** {len(divergent_families)}\n")
              out.write(f"- **Chained Markdown Extension Artifacts:** {len(extension_glitches)}\n")
              out.write(f"- **Active Naming Violations:** {len(active_naming_violations)}\n\n")
              out.write("## Active Directory / File Naming Gate\n")
              if active_naming_violations:
                  for violation in active_naming_violations:
                      out.write(f"- {violation}\n")
              else:
                  out.write("No active-directory naming violations found.\n")

              out.write("\n## Exact Duplicate Groups\n")
              for index, group in enumerate(exact_duplicates, 1):
                  out.write(f"### Group {index}\n")
                  for item in group:
                      out.write(f"- {item['path']}\n")

              out.write("\n## Divergent Version Families\n")
              for index, group in enumerate(divergent_families, 1):
                  out.write(f"### Family {index}: {group[0]['name']}\n")
                  for item in group:
                      out.write(f"- {item['path']} ({item['size_kb']} KB)\n")
                  if len(group) >= 2 and group[0]['preview'] and group[1]['preview']:
                      ratio = round(difflib.SequenceMatcher(None, group[0]['preview'], group[1]['preview']).ratio() * 100, 1)
                      out.write(f"- Preview overlap of first two: {ratio}%\n")

          if active_naming_violations:
              print("ERROR: active-directory naming violations detected:")
              for violation in active_naming_violations:
                  print(f" - {violation}")
              raise SystemExit(1)
          print("Active-directory naming gate passed.")
          PY
